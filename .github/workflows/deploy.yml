name: Major release - for tags with commit in `main` branch
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: deployment
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.verify-tag.outputs.proceed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        # Ensure we can get latest tag futher below by including tags
        # More details at https://github.com/actions/checkout/issues/1471#issuecomment-1755639487
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Verify tag is on main branch
        id: verify-tag
        run: |
          if git merge-base --is-ancestor $(git rev-parse HEAD) origin/main; then
            echo "Tag is on main branch, proceeding with deployment"
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
              echo "Tag is not on main branch, aborting"
              echo "proceed=false" >> $GITHUB_OUTPUT
          fi

  test:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run service tests
        run: bun run test-services

  build:
    needs: test
    if: needs.check.outputs.proceed == 'true'
    strategy:
      matrix:
        include:
          # Universal (platform-agnostic) build. Open VSX clients like Windsurf
          # default to resolving a "universal" targetPlatform. Without this, they
          # fall back to the last universal version ever published (v1.14.26).
          # See: https://github.com/eclipse-openvsx/openvsx/issues/943
          - os: ubuntu-22.04
            platform: ''
            arch: ''
            npm_config_arch: x64
          - os: windows-2022
            platform: win32
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: arm64
            npm_config_arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: armhf
            npm_config_arch: arm
          - os: ubuntu-22.04
            platform: alpine
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install macOS dependencies
        if: contains(matrix.os, 'macos')
        run: brew install python-setuptools
      - name: Install Windows dependencies
        if: contains(matrix.os, 'windows')
        run: pip install setuptools
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Install vsce
        run: bun install -g @vscode/vsce
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_config_arch }}
      - name: Set target
        shell: pwsh
        run: echo "target=${{ matrix.platform && format('{0}-{1}', matrix.platform, matrix.arch) }}" >> $env:GITHUB_ENV
      - name: Package extension
        run: |
          if [ -n "${{ env.target }}" ]; then
            bun run compile && bunx vsce package --target ${{ env.target }}
          else
            bun run compile && bunx vsce package
          fi
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.target || 'universal' }}
          path: '*.vsix'
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.proceed == 'true' && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Install vsce
        run: bun install -g @vscode/vsce
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes
          for file in **/*.vsix; do
            gh release upload ${{ github.ref_name }} "$file"
          done
      - run: bunx vsce publish --packagePath $(find . -iname *.vsix)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Install ovsx
        run: bun install -g ovsx
      - name: Publish to OpenVSX Registry
        run: |
          for file in **/*.vsix; do
            bunx ovsx publish "$file" -p ${{ secrets.OPEN_VSX_DEVDB_TOKEN }}
          done
