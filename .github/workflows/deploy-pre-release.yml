name: Pre-release - for tags with commit in dev branch
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  # Exact versions: these tools run with the publish tokens.
  VSCE_VERSION: "3.9.2"
  OVSX_VERSION: "1.2.0"

concurrency:
  group: pre-release
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.verify-tag.outputs.proceed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        # Ensure we can get latest tag futher below by including tags
        # More details at https://github.com/actions/checkout/issues/1471#issuecomment-1755639487
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Verify tag is on dev branch
        id: verify-tag
        run: |
          if git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/dev; then
            echo "Tag is on dev branch, proceeding with deployment"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
              echo "Tag is not on dev branch, aborting"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    runs-on: ubuntu-latest
    if: needs.check.outputs.proceed == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (high and critical)
        run: bun audit --audit-level=high

      - name: Run service tests
        run: bun run test-services

      - name: Run SQLite tests on the WASM backend
        run: bun run test-services:wasm

  build:
    needs: [check, test]
    if: needs.check.outputs.proceed == 'true'
    strategy:
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
            npm_config_arch: x64
          # - os: windows-2022
          #   platform: win32
          #   arch: arm64
          #   npm_config_arch: arm64
          # - os: ubuntu-22.04
          #   platform: linux
          #   arch: x64
          #   npm_config_arch: x64
          # - os: ubuntu-22.04-arm
          #   platform: linux
          #   arch: arm64
          #   npm_config_arch: arm64
          # - os: ubuntu-22.04
          #   platform: linux
          #   arch: armhf
          #   npm_config_arch: arm
          # - os: ubuntu-22.04
          #   platform: alpine
          #   arch: x64
          #   npm_config_arch: x64
          # - os: ubuntu-22.04-arm
          #   platform: alpine
          #   arch: arm64
          #   npm_config_arch: arm64
          # - os: macos-latest
          #   platform: darwin
          #   arch: x64
          #   npm_config_arch: x64
          # - os: macos-latest
          #   platform: darwin
          #   arch: arm64
          #   npm_config_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install macOS dependencies
        if: contains(matrix.os, 'macos')
        run: brew install python-setuptools
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_config_arch }}
      - shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV
      # bun builds node-gyp addons (@vscode/sqlite3, ssh2, cpu-features) for the runner: rebuild them for the target.
      # Linux targets build in a container of the target platform (armhf through QEMU); win32-arm64 cross-compiles.
      - name: Set up QEMU
        if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm
      - name: Rebuild native addons for target
        shell: bash
        run: .github/scripts/rebuild-native.sh "${{ env.target }}"
      # bun installs the DuckDB binding for the runner, not for the target. Replace it with the
      # target's binding (exact lockfile version) and remove the others. No binding for armhf.
      - name: Install DuckDB binding for target
        shell: bash
        run: node .github/scripts/prepare-native-deps.js "${{ env.target }}"
      - name: Package extension
        shell: bash
        run: bun run compile && npx --yes "@vscode/vsce@${VSCE_VERSION}" package --pre-release --target ${{ env.target }}
      - name: Verify native dependencies in VSIX
        shell: bash
        run: node .github/scripts/prepare-native-deps.js --verify "${{ env.target }}" ./*.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.target }}
          path: '*.vsix'
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.proceed == 'true' && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        # Ensure we can get latest tag futher below by including tags
        # More details at https://github.com/actions/checkout/issues/1471#issuecomment-1755639487
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0) || { echo "No existing tags found. Please create a tag first."; exit 1; }
          # Immutable releases: assets must go up in the create call (gh uploads to a draft, then publishes).
          gh release create "$LATEST_TAG" --generate-notes **/*.vsix
      - name: Publish to VS Code Marketplace
        run: find . -iname '*.vsix' -print0 | xargs -0 npx --yes "@vscode/vsce@${VSCE_VERSION}" publish --pre-release --packagePath
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to OpenVSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_DEVDB_TOKEN }}
        run: |
          for file in **/*.vsix; do
            npx --yes "ovsx@${OVSX_VERSION}" publish "$file"
          done
