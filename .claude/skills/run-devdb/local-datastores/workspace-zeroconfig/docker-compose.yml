# Describes the stack that ../docker-compose.yml runs (devdb-local-*), for DevDb's zero-config
# docker-compose detection. Do not start this file: ../up.sh starts the real services.
# neon-tls is left out: it needs TLS, which compose detection does not turn on.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devdb
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-devdb}
      POSTGRES_DB: vectors
    ports: ["5433:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--requirepass", "valkeypass"]
    ports: ["6380:6379"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: devdb
      CLICKHOUSE_DB: devdb
    ports: ["8123:8123"]
