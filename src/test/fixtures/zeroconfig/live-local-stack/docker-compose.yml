# Mirrors .claude/skills/run-devdb/local-datastores (the running devdb-local-* stack).
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devdb
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-devdb}
      POSTGRES_DB: vectors
    ports: ["5433:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--requirepass", "valkeypass"]
    ports: ["6380:6379"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=devdb
      - CLICKHOUSE_DB=devdb
    ports: ["8123:8123"]
